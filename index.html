<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>أُفُق الإتقان | نافس القراءة</title>
<style>
*{box-sizing:border-box}:root{--pink:#d96f8b;--rose:#a64d67;--light:#fff4f7;--cream:#fffaf8;--ink:#663745;--line:#f1cad5}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(#fff7fa,#fdebf1);color:var(--ink);min-height:100vh}
header{background:rgba(255,255,255,.78);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
nav{max-width:1050px;margin:auto;display:flex;gap:8px;align-items:center;padding:10px 16px;overflow:auto}
.logo{font-weight:800;margin-left:auto;white-space:nowrap}nav button,.pill{border:0;background:#fff0f4;color:var(--ink);padding:10px 14px;border-radius:14px;white-space:nowrap}
main{max-width:1000px;margin:auto;padding:22px 14px 50px}
.hero{background:radial-gradient(circle at 80% 10%,#fff 0,#ffe8ef 35%,#fbd7e2 100%);border:1px solid #f4c7d3;border-radius:30px;padding:34px;box-shadow:0 16px 50px #9b4b6518;position:relative;overflow:hidden}
.hero:after{content:"🎀";position:absolute;left:22px;bottom:8px;font-size:70px;opacity:.35}
.nafs{display:inline-block;background:white;border-radius:18px;padding:8px 13px;font-weight:bold;color:#31539a;box-shadow:0 5px 18px #0001}
h1{font-size:48px;margin:18px 0 6px;color:#8d4259}.sub{font-size:19px}.motto{font-size:20px;font-weight:bold;color:#b55270}
.girl{font-size:72px;float:left;margin:0 10px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.card{border:1px solid var(--line);background:#fffafa;border-radius:22px;padding:20px;text-align:center;box-shadow:0 8px 22px #8b435414;cursor:pointer;color:var(--ink)}
.card b{display:block;font-size:19px;margin:8px}.card span{font-size:13px;line-height:1.7}.card:hover{transform:translateY(-2px)}
.quote{margin:20px 0;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;text-align:center;font-size:20px;font-weight:bold}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 10px 35px #7d3e5212}.hidden{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.progress{height:9px;background:#f7e4ea;border-radius:99px;overflow:hidden;margin:14px 0 20px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#e88ca4,#c95e7c);width:0}
.passage{background:#fff6f8;border-right:5px solid #dc829b;border-radius:18px;padding:18px;line-height:2}.skill{display:inline-block;background:#f9dce5;padding:7px 12px;border-radius:99px;margin-top:18px}
.choice{display:block;width:100%;text-align:right;border:1px solid #efd0d9;background:#fff;border-radius:15px;padding:14px;margin:10px 0;font-size:16px;color:var(--ink)}.correct{background:#eef9f1;border-color:#86bb94}.wrong{background:#fff0f2;border-color:#d98b9c}
.feedback{background:#fff3f6;padding:14px;border-radius:15px;line-height:1.8;margin:14px 0}.primary{border:0;background:linear-gradient(135deg,#d86e8b,#b94e6d);color:white;padding:13px 20px;border-radius:15px;font-size:16px}
.score{font-size:52px;text-align:center;font-weight:bold;color:#b34d6b}footer{text-align:center;padding:24px;color:#92546a}
@media(max-width:720px){.cards{grid-template-columns:repeat(2,1fr)}h1{font-size:38px}.hero{padding:24px}}@media(max-width:430px){.cards{grid-template-columns:1fr 1fr}.card{padding:15px}}
</style></head><body>
<header><nav><div class="logo">🎀 أُفُق الإتقان</div><button onclick="home()">الرئيسية</button><button onclick="start('sim')">محتوى التدريب</button><button onclick="start('sim')">مستواي</button></nav></header>
<main>
<section id="home" class="hero"><div class="girl">👧🏻</div><div class="nafs">✓ ؟ ! &nbsp; نافس NAFS</div><h1>أُفُق الإتقان</h1><p class="sub">منصة تدريبية في نافس – مجال القراءة</p><p class="motto">أقرأ • أفهم • أُحلّل • أرتقي ♥</p><div style="clear:both"></div>
<div class="cards"><button class="card" onclick="start('التأسيس')"><div>🌱</div><b>التأسيس</b><span>المفردات والفهم المباشر</span></button><button class="card" onclick="start('الإتقان')"><div>📖</div><b>الإتقان</b><span>الاستنتاج وتحليل النص</span></button><button class="card" onclick="start('التحدي')"><div>🏆</div><b>التحدي</b><span>التقويم والتعليل</span></button><button class="card" onclick="start('sim')"><div>🎯</div><b>محاكي نافس</b><span>تدريب متنوع ونتيجة شاملة</span></button></div>
<div class="quote">القراءة اليوم .. تصنع فرص الغد ♥</div></section>
<section id="quiz" class="panel hidden"><div class="top"><button class="pill" onclick="home()">⌂ الرئيسية</button><b id="count"></b></div><div class="progress"><i id="bar"></i></div><div class="passage"><h3 id="pt"></h3><div id="px"></div></div><span class="skill" id="skill"></span><h2 id="q"></h2><div id="choices"></div><div id="fb" class="feedback hidden"></div><button id="next" class="primary hidden" onclick="next()">السؤال التالي ←</button></section>
<section id="result" class="panel hidden"><h2 style="text-align:center">✨ أحسنتِ يا بطلة القراءة ✨</h2><div id="score" class="score"></div><p id="msg" style="text-align:center"></p><div id="report"></div><p style="text-align:center"><button class="primary" onclick="home()">العودة للرئيسية</button></p></section>
</main><footer>معًا .. نحو جيل يُجيد القراءة ♥<br>تصميم وإعداد: أريج المطيري • الصف السادس الابتدائي</footer>
<script>
const bank=[{"level": "التأسيس", "skill": "دلالة المفردات", "title": "حديقة الحي", "text": "اجتمع سكان الحي صباح السبت لزراعة الأشجار في الساحة القريبة. حمل الصغار الشتلات، وتولى الكبار تجهيز التربة. وبعد أسابيع بدأت الأوراق الخضراء تظهر، فشعر الجميع بأن تعاونهم أثمر مكانًا أجمل.", "q": "ما المعنى الأنسب لكلمة «أثمر» في السياق؟", "choices": ["أنتج نتيجة طيبة", "تحول إلى ثمار فقط", "انتهى سريعًا", "زاد عدد السكان"], "a": 0, "why": "استُخدمت «أثمر» هنا بمعنى نتج عنه أثر طيب؛ وهو تحسّن المكان بفضل التعاون."}, {"level": "التأسيس", "skill": "الفكرة الرئيسة", "title": "حديقة الحي", "text": "اجتمع سكان الحي صباح السبت لزراعة الأشجار في الساحة القريبة. حمل الصغار الشتلات، وتولى الكبار تجهيز التربة. وبعد أسابيع بدأت الأوراق الخضراء تظهر، فشعر الجميع بأن تعاونهم أثمر مكانًا أجمل.", "q": "ما الفكرة الرئيسة للنص؟", "choices": ["التعاون في تحسين البيئة", "طريقة شراء الشتلات", "اختلاف أعمار السكان", "موعد اجتماع سكان الحي"], "a": 0, "why": "تدور أحداث النص كلها حول تعاون سكان الحي لزراعة الساحة وتحسينها."}, {"level": "التأسيس", "skill": "المعلومات الصريحة", "title": "مكتبة الفصل", "text": "وضعت المعلمة صندوقًا للكتب في زاوية الفصل، وطلبت من كل طالبة أن تختار كتابًا أسبوعيًا. وبعد شهر، أصبحت الطالبات يتبادلن ترشيحات الكتب ويتحدثن عن شخصياتها في وقت الاستراحة.", "q": "أين وضعت المعلمة صندوق الكتب؟", "choices": ["في زاوية الفصل", "في ساحة المدرسة", "في المنزل", "في المختبر"], "a": 0, "why": "وردت المعلومة صريحة في بداية النص: «في زاوية الفصل»."}, {"level": "الإتقان", "skill": "الاستنتاج", "title": "مكتبة الفصل", "text": "وضعت المعلمة صندوقًا للكتب في زاوية الفصل، وطلبت من كل طالبة أن تختار كتابًا أسبوعيًا. وبعد شهر، أصبحت الطالبات يتبادلن ترشيحات الكتب ويتحدثن عن شخصياتها في وقت الاستراحة.", "q": "ماذا يمكن أن نستنتج من النص؟", "choices": ["ازداد اهتمام الطالبات بالقراءة", "توقفت الطالبات عن الاستراحة", "كانت الكتب مقررات دراسية", "لم تستخدم الطالبات الصندوق"], "a": 0, "why": "تبادل الترشيحات والحديث عن الكتب يدل على تنامي الاهتمام بالقراءة."}, {"level": "الإتقان", "skill": "العلاقات بين الأفكار", "title": "الماء مورد ثمين", "text": "تحتاج حياتنا اليومية إلى الماء، لكن مصادره ليست بلا حدود. لذلك يساعد إغلاق الصنبور أثناء تنظيف الأسنان وإصلاح التسربات على تقليل الهدر والمحافظة على هذا المورد.", "q": "ما العلاقة بين محدودية مصادر الماء والسلوكيات المذكورة؟", "choices": ["سبب ونتيجة", "تشابه", "تسلسل زمني فقط", "تضاد"], "a": 0, "why": "محدودية الماء سبب يدفع إلى سلوكيات تقلل الهدر؛ لذا فالعلاقة سبب ونتيجة."}, {"level": "الإتقان", "skill": "الغرض من النص", "title": "دقائق تصنع عادة", "text": "خصصت نورة عشر دقائق للقراءة كل مساء. وبعد أسابيع أنهت عدة كتب، وصارت تنتظر وقت القراءة بشغف. فالعادة الصغيرة إذا استمرت قد تصنع أثرًا كبيرًا.", "q": "ما الغرض الأقرب من النص؟", "choices": ["التشجيع على بناء عادة قراءة مستمرة", "شرح طريقة طباعة الكتب", "المقارنة بين المكتبات", "وصف غرفة نورة"], "a": 0, "why": "يركز النص على أثر الاستمرار في عادة قراءة صغيرة، لذلك غرضه التشجيع على القراءة المنتظمة."}, {"level": "التحدي", "skill": "تقويم النص", "title": "التعلم بالمشروعات", "text": "يرى فريق من الطلاب أن تنفيذ مشروع جماعي يساعدهم على توزيع المهام وتبادل الأفكار، بينما يفضل آخرون العمل الفردي لأنه يمنحهم حرية أكبر في تنظيم الوقت. ويعتمد الاختيار الأفضل على طبيعة المهمة والهدف منها.", "q": "أي عبارة تدعم خاتمة النص بصورة أفضل؟", "choices": ["بعض المهام تستفيد من التعاون، وأخرى تناسب العمل الفردي", "العمل الجماعي أفضل دائمًا", "العمل الفردي لا يحتاج تنظيمًا", "كل المشروعات يجب أن تنفذ بالطريقة نفسها"], "a": 0, "why": "الخاتمة تربط الاختيار بطبيعة المهمة ولا تفضّل طريقة واحدة في جميع الحالات."}, {"level": "التحدي", "skill": "التعليل", "title": "القراءة قبل النوم", "text": "اختارت سارة أن تضع كتابها قرب سريرها، وحددت عشر دقائق للقراءة كل مساء. لم تكن المدة طويلة، لكنها استمرت عليها أسابيع، فأنهت عدة كتب دون أن تشعر أن القراءة عبء إضافي.", "q": "لماذا نجحت عادة سارة بحسب النص؟", "choices": ["لأنها اعتمدت وقتًا قصيرًا واستمرت عليه", "لأن الكتب كانت قصيرة بالضرورة", "لأنها قرأت مرة واحدة أسبوعيًا", "لأنها لم تحدد وقتًا للقراءة"], "a": 0, "why": "يربط النص نجاحها بقصر المدة وسهولة الاستمرار عليها لأسابيع."}]; let quiz=[],i=0,points=0,stats={};
function start(level){quiz=level==='sim'?[...bank]:bank.filter(x=>x.level===level);quiz.sort(()=>Math.random()-.5);i=0;points=0;stats={};show('quiz');render()}
function show(id){['home','quiz','result'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
function home(){show('home')}
function render(){let x=quiz[i];count.textContent=`${i+1} من ${quiz.length}`;bar.style.width=`${i/quiz.length*100}%`;pt.textContent=x.title;px.textContent=x.text;skill.textContent=x.skill;q.textContent=x.q;choices.innerHTML='';x.choices.forEach((t,n)=>{let b=document.createElement('button');b.className='choice';b.textContent=t;b.onclick=()=>answer(n,b);choices.appendChild(b)});fb.classList.add('hidden');next.classList.add('hidden')}
function answer(n,b){let x=quiz[i];document.querySelectorAll('.choice').forEach(e=>e.disabled=true);document.querySelectorAll('.choice')[x.a].classList.add('correct');let ok=n===x.a;if(!ok)b.classList.add('wrong');if(ok)points++;stats[x.skill]??={ok:0,total:0};stats[x.skill].total++;if(ok)stats[x.skill].ok++;fb.innerHTML=`<b>${ok?'إجابة صحيحة ✓':'الإجابة تحتاج مراجعة'}</b><br>${x.why}`;fb.classList.remove('hidden');next.classList.remove('hidden')}
function next(){i++;i<quiz.length?render():finish()}
function finish(){show('result');let p=Math.round(points/quiz.length*100);score.textContent=p+'%';msg.textContent=p>=80?'إتقان رائع، واصلي التألق ♥':p>=60?'تقدم جميل، أعيدي تدريب المهارات الأقل إتقانًا.':'كل محاولة تقرّبك من الإتقان؛ راجعي التفسير ثم حاولي مجددًا.';report.innerHTML=Object.entries(stats).map(([k,v])=>`<div class="quote">${k} — ${Math.round(v.ok/v.total*100)}%</div>`).join('')}
</script></body></html>
