<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استيراد حسابات أفق الإتقان</title><style>body{font-family:system-ui;background:#fff7fa;padding:22px;color:#3d2b34}.c{max-width:700px;margin:auto;background:#fff;padding:22px;border-radius:22px;border:1px solid #efc8d7}button,input{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:13px;font-size:16px}button{border:0;font-weight:700}.p{background:#b94f78;color:#fff}.s{background:#f8e4ec;color:#7d3652}.m{padding:12px;background:#eef9f1;border-radius:12px;white-space:pre-wrap}.w{padding:12px;background:#fff3d8;border-radius:12px}</style></head><body><div class="c"><h2>أُفُق الإتقان — استيراد حسابات الطالبات</h2><p class="w">هذه الصفحة لا تحتوي أسماء أو أكواد. تختارين ملف CSV من جهازك فقط عند التنفيذ.</p><button id="login" class="s">1) دخول المعلمة بحساب Google</button><input id="file" type="file" accept=".csv,text/csv"><button id="run" class="p" disabled>2) استيراد 72 حسابًا</button><div id="st" class="m">بانتظار دخول المعلمة واختيار الملف…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script>
firebase.initializeApp({apiKey:"AIzaSyAbHeYou6Vd0eggV2t4zY0bxZRmHpRfp8M",authDomain:"ofuq-alitqan.firebaseapp.com",projectId:"ofuq-alitqan",storageBucket:"ofuq-alitqan.firebasestorage.app",messagingSenderId:"700158897109",appId:"1:700158897109:web:1412707c02a994e2082b5c"});
const auth=firebase.auth(),db=firebase.firestore(),UID="2YHGMBKr4xPPgiuMwxN7iDGJwwQ2",st=document.getElementById("st"),f=document.getElementById("file"),run=document.getElementById("run");
function norm(v){return String(v||"").trim().replace(/\s+/g," ").toLowerCase()}async function hash(s){let h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function ready(){run.disabled=!(auth.currentUser&&auth.currentUser.uid===UID&&f.files.length)}
auth.onAuthStateChanged(u=>{st.textContent=u&&u.uid===UID?"✓ تم دخول المعلمة. اختاري ملف الحسابات.":u?"هذا ليس حساب المعلمة المعتمد.":"بانتظار دخول المعلمة واختيار الملف…";ready()});f.onchange=ready;
login.onclick=async()=>{try{let c=await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());if(c.user.uid!==UID){await auth.signOut();throw Error("حساب Google مختلف عن حساب المعلمة المعتمد.")}}catch(e){st.textContent="تعذر الدخول: "+e.message}};
run.onclick=async()=>{run.disabled=true;try{let t=(await f.files[0].text()).replace(/^\uFEFF/,"").replace(/\r/g,""),ls=t.split("\n").filter(x=>x.trim()),hd=ls.shift().split(",").map(x=>x.trim()),ni=hd.indexOf("name"),ci=hd.indexOf("code"),fi=hd.indexOf("className");if(ni<0||ci<0||fi<0)throw Error("الملف لا يحتوي الأعمدة المطلوبة.");let a=ls.map(l=>{let x=l.split(",");return{name:(x[ni]||"").trim(),code:(x[ci]||"").trim(),className:(x[fi]||"").trim()}}).filter(x=>x.name&&x.code&&x.className);if(a.length!==72)throw Error("الملف يحتوي "+a.length+" حسابًا، والمتوقع 72.");let b=db.batch();for(let x of a){if(!["سادس أ","سادس ب"].includes(x.className))throw Error("وجد فصل غير صحيح.");let id=await hash(x.className+"|"+norm(x.name)+"|"+x.code);b.set(db.collection("studentAccounts").doc(id),{name:x.name,className:x.className,active:true},{merge:true})}await b.commit();st.textContent="✓ تم الاستيراد بنجاح: 72 حسابًا."}catch(e){st.textContent="لم يتم الاستيراد: "+e.message}ready()};
</script></body></html>
