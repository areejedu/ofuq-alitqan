<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أُفُق الإتقان — تنظيف النتائج التجريبية</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:#fff7fa;color:#49323c;margin:0;padding:28px 16px}
.card{max-width:620px;margin:auto;background:white;border:2px solid #efc4d2;border-radius:28px;padding:24px;box-shadow:0 12px 35px #8d3f5c18}
h1{color:#7e3653;margin-top:0} .note{background:#fff3d8;border-radius:18px;padding:15px;line-height:1.8}
.safe{background:#eef9f0;border-radius:18px;padding:15px;margin:14px 0;line-height:1.8}
button{width:100%;border:0;border-radius:18px;padding:16px;margin-top:12px;font-size:17px;font-weight:700}
.login{background:#f4dfe7;color:#7e3653} .clean{background:#b64f78;color:#fff}
.clean:disabled{opacity:.45} #status{margin-top:16px;padding:14px;border-radius:16px;background:#f7f7f7;line-height:1.7}
</style>
</head>
<body>
<div class="card">
<h1>أُفُق الإتقان — تنظيف النتائج التجريبية</h1>
<div class="note">هذه الصفحة تحذف سجلات <b>المحاولات القديمة فقط</b> من <b>attempts</b>. لا تعدّل حسابات الطالبات ولا الرموز الجديدة.</div>
<button class="login" onclick="teacherLogin()">1) دخول المعلمة بحساب Google</button>
<button id="cleanBtn" class="clean" disabled onclick="cleanAttempts()">2) حذف النتائج التجريبية وبدء الإحصائيات من الصفر</button>
<div class="safe">لن يتم حذف <b>studentAccounts</b> أو تغيير أي رمز دخول.</div>
<div id="status">بانتظار دخول المعلمة.</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyAbHeYou6Vd0eggV2t4zY0bxZRmHpRfp8M",authDomain:"ofuq-alitqan.firebaseapp.com",projectId:"ofuq-alitqan",storageBucket:"ofuq-alitqan.firebasestorage.app",messagingSenderId:"700158897109",appId:"1:700158897109:web:1412707c02a994e2082b5c"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
const TEACHER_UID="2YHGMBKr4xPPgiuMwxN7iDGJwwQ2";
const statusEl=document.getElementById("status"), cleanBtn=document.getElementById("cleanBtn");

async function teacherLogin(){
 try{
   if(auth.currentUser && auth.currentUser.uid===TEACHER_UID){ready();return}
   if(auth.currentUser) await auth.signOut();
   const p=new firebase.auth.GoogleAuthProvider();
   p.setCustomParameters({prompt:"select_account"});
   const r=await auth.signInWithPopup(p);
   if(!r.user || r.user.uid!==TEACHER_UID){
     if(auth.currentUser) await auth.signOut();
     statusEl.textContent="هذا الحساب ليس حساب المعلمة المعتمد.";
     return;
   }
   ready();
 }catch(e){statusEl.textContent="تعذر تسجيل الدخول: "+(e.message||e);}
}
function ready(){
 statusEl.textContent="✓ حساب المعلمة صحيح. جاهز لتنظيف النتائج التجريبية.";
 cleanBtn.disabled=false;
}
async function deleteRefs(refs){
 for(let i=0;i<refs.length;i+=400){
   const b=db.batch();
   refs.slice(i,i+400).forEach(r=>b.delete(r));
   await b.commit();
 }
}
async function cleanAttempts(){
 if(!auth.currentUser || auth.currentUser.uid!==TEACHER_UID){statusEl.textContent="سجلي دخول المعلمة أولًا.";return}
 if(!confirm("سيتم حذف جميع المحاولات المسجلة حاليًا وبدء الإحصائيات الرسمية من الصفر. حسابات الطالبات والرموز لن تتغير. متابعة؟")) return;
 cleanBtn.disabled=true; statusEl.textContent="جارٍ تنظيف النتائج القديمة…";
 try{
   const snap=await db.collection("attempts").get();
   await deleteRefs(snap.docs.map(d=>d.ref));
   statusEl.textContent="✓ تم تنظيف "+snap.size+" نتيجة/محاولة قديمة بنجاح. حسابات الطالبات والرموز الجديدة لم تتغير.";
 }catch(e){
   console.error(e);
   statusEl.textContent="لم يتم التنظيف. "+(e.code||"")+" "+(e.message||e);
   cleanBtn.disabled=false;
 }
}
auth.onAuthStateChanged(u=>{if(u && u.uid===TEACHER_UID) ready();});
</script>
</body></html>
